# Step 1 of 2 (patch 1, B9): serves ACME challenges so the first certificate
# can be issued. The HTTPS config can't load until that certificate exists.
server {
  listen 80 default_server;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / {
    default_type text/plain;
    return 200 'Audify API: certificate pending';
  }
}
